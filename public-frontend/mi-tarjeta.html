<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi tarjeta — ARGAYES</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#b8872b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&family=Quicksand:wght@400;600;700&family=Oswald:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Página pública para EL CLIENTE FINAL: abre su propia tarjeta de
     lealtad ya con la personalización real del negocio (logo, nombre,
     tipografía, colores, forma/tamaño de sellos) — a diferencia del pase
     de Apple/Google Wallet, que no permite elegir tipografía ni forma de
     sello. Se abre con un link que trae el id del cliente y el backend
     (?id=...&backend=...), sin necesitar cuenta ni contraseña — el mismo
     modelo de seguridad que ya usan los links de Wallet: cualquiera con el
     id exacto (un UUID, imposible de adivinar) puede verla. */
  :root{
    --bg:#f3f1ec; --surface:#ffffff; --surface-2:#eae6db;
    --ink:#1b1f23; --ink-dim:#5b6066; --border:#d8d3c4;
    --accent:#b8872b; --accent-ink:#2a1c05; --accent-soft:#f1e3c3;
    --good:#2f7a4f; --good-soft:#e1efe3;
    --danger:#b2563e; --danger-soft:#f6e3df;
    --font-display:"Times New Roman", Times, Georgia, serif;
    --font-body:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181b; --surface:#1e2226; --surface-2:#262b30;
      --ink:#eceae4; --ink-dim:#9ba1a6; --border:#343a3f;
      --accent:#d9a84a; --accent-ink:#1b1206; --accent-soft:#3a2f17;
      --good:#5fbf86; --good-soft:#1c2e22;
      --danger:#e06a56; --danger-soft:#33201c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181b; --surface:#1e2226; --surface-2:#262b30;
    --ink:#eceae4; --ink-dim:#9ba1a6; --border:#343a3f;
    --accent:#d9a84a; --accent-ink:#1b1206; --accent-soft:#3a2f17;
    --good:#5fbf86; --good-soft:#1c2e22;
    --danger:#e06a56; --danger-soft:#33201c;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
    padding:calc(28px + env(safe-area-inset-top,0px)) 16px 40px;
    min-height:100vh;
  }
  main{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .top-brand{text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}

  /* ---- menú de 3 rayas: mismo componente de index.html / registro.html ---- */
  .menu-btn{
    position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:30;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
    width:40px;height:40px;border-radius:8px;border:1.5px solid var(--border);
    background:var(--surface);cursor:pointer;padding:0;
  }
  .menu-btn:hover{border-color:var(--accent)}
  .menu-btn span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px}
  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40;
  }
  .scrim.open{opacity:1;pointer-events:auto}
  .menu-panel{
    position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);
    background:var(--surface);border-right:1px solid var(--border);
    transform:translateX(-100%);transition:transform .2s ease;z-index:41;
    padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px max(20px, env(safe-area-inset-left,0px));
    display:flex;flex-direction:column;gap:18px;
  }
  .menu-panel.open{transform:translateX(0)}
  .menu-panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin:0}
  .panel-close{align-self:flex-end;background:none;border:none;color:var(--ink-dim);font-size:22px;line-height:1;cursor:pointer;margin:-6px -6px 0 0}
  .theme-switch > span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:8px}
  .theme-options{display:flex;gap:8px}
  .theme-opt{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    border:1.5px solid var(--border);border-radius:8px;background:transparent;
    color:var(--ink);font-family:var(--font-body);font-size:13px;font-weight:600;
    padding:10px 6px;cursor:pointer;
  }
  .theme-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  @media (prefers-reduced-motion: no-preference){
    .tarjeta-card{transition:transform .25s ease}
    .tarjeta-card:hover{transform:translateY(-3px)}
  }

  .tarjeta-card{
    border-radius:18px;padding:22px;min-height:260px;color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;gap:18px;
    box-shadow:0 14px 34px rgba(0,0,0,.2);
  }
  .tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .tc-brand{display:flex;align-items:center;gap:10px;min-width:0}
  .tc-logo{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,.18);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .tc-logo img{width:100%;height:100%;object-fit:cover}
  .tc-nombre{font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
  .tc-sellos-head{text-align:right}
  .tc-sellos-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
  .tc-sellos-contador{font-family:var(--font-mono);font-size:19px;font-weight:700}
  .tc-sellos-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tc-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .tc-col{min-width:0}
  .tc-col.right{text-align:right}
  .tc-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-bottom:2px}
  .tc-value{font-size:14px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .tc-qr{background:#fff;border-radius:10px;padding:6px;flex:none}
  .tc-qr canvas, .tc-qr img{display:block;width:84px!important;height:84px!important}

  .listo-banner{
    background:var(--good-soft);color:var(--good);border-radius:12px;padding:14px 16px;
    font-size:14px;font-weight:600;text-align:center;
  }
  .hint-card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;font-size:13px;color:var(--ink-dim);text-align:center;
  }
  .progreso-txt{text-align:center;font-size:15px;font-weight:600;margin:16px 0 0;color:var(--ink)}
  .wallet-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .wallet-btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;
    border-radius:10px;border:0;background:#111;color:#fff;font:600 14px/1 var(--font-body);
    text-decoration:none;cursor:pointer;flex:1 1 180px;max-width:260px;
  }
  .wallet-btn[disabled]{opacity:.6;cursor:default}
  .wallet-msg{text-align:center;font-size:13px;color:var(--ink-dim);margin:10px 0 0}
  .estado{text-align:center;padding:60px 16px;color:var(--ink-dim);font-size:14px}
  .estado.error{
    color:var(--ink);background:var(--accent-soft);border:1px solid var(--accent);
    border-radius:12px;padding:20px 18px;margin-top:8px;
  }
  [hidden]{display:none!important}
</style>

<button type="button" class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuPanel">
  <span></span><span></span><span></span>
</button>
<div class="scrim" id="scrim"></div>
<nav class="menu-panel" id="menuPanel" aria-label="Menú">
  <button class="panel-close" id="panelClose" aria-label="Cerrar menú">&times;</button>
  <h2>Menú</h2>
  <div class="theme-switch">
    <span>Tema</span>
    <div class="theme-options">
      <button type="button" class="theme-opt" data-theme-choice="light">☀️ Claro</button>
      <button type="button" class="theme-opt" data-theme-choice="dark">🌙 Oscuro</button>
    </div>
  </div>
</nav>

<main>
  <div class="top-brand">Tarjeta de lealtad</div>
  <div id="estadoCarga" class="estado">Cargando tu tarjeta…</div>
  <div id="estadoError" class="estado error" hidden></div>

  <div id="tarjetaWrap" hidden>
    <div class="tarjeta-card" id="tcCard">
      <div class="tc-top">
        <div class="tc-brand">
          <span class="tc-logo" id="tcLogoWrap"></span>
          <span class="tc-nombre" id="tcNombre"></span>
        </div>
        <div class="tc-sellos-head">
          <div class="tc-sellos-label">Sellos</div>
          <div class="tc-sellos-contador" id="tcContador"></div>
        </div>
      </div>
      <div class="tc-sellos-grid" id="tcSellosGrid"></div>
      <div class="tc-bottom">
        <div class="tc-col">
          <div class="tc-label">Recompensa</div>
          <div class="tc-value" id="tcRecompensa"></div>
        </div>
        <div class="tc-qr" id="tcQrWrap"></div>
        <div class="tc-col right">
          <div class="tc-label">Cliente</div>
          <div class="tc-value" id="tcCliente"></div>
        </div>
      </div>
    </div>

    <div class="listo-banner" id="listoBanner" hidden style="margin-top:14px">¡Ya puedes canjear tu recompensa! Muéstrale esta pantalla o tu QR al negocio.</div>
    <p class="progreso-txt" id="progresoTxt"></p>
    <div class="wallet-row" id="walletRow">
      <a class="wallet-btn" id="appleBtn" href="#" hidden>Agregar a Apple Wallet</a>
      <button class="wallet-btn" id="googleBtn" type="button" hidden>Agregar a Google Wallet</button>
    </div>
    <p class="wallet-msg" id="walletMsg" hidden></p>
    <p class="hint-card" style="margin-top:14px">Guarda este link — es tu tarjeta. Muestra el código QR en el negocio para sumar tus sellos; se actualiza sola.</p>
  </div>
</main>

<script src="vendor/qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('argayes-theme'); } catch(e){}
  if(savedTheme === 'dark' || savedTheme === 'light') root.setAttribute('data-theme', savedTheme);

  // ---- menú de 3 rayas + selector de tema (mismo componente que en
  // index.html y registro.html) ----
  (function(){
    var menuBtn = document.getElementById('menuBtn');
    var panel = document.getElementById('menuPanel');
    var scrim = document.getElementById('scrim');
    var panelClose = document.getElementById('panelClose');
    var themeOpts = document.querySelectorAll('.theme-opt');

    function openPanel(){ panel.classList.add('open'); scrim.classList.add('open'); menuBtn.setAttribute('aria-expanded','true'); }
    function closePanel(){ panel.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }
    menuBtn.addEventListener('click', openPanel);
    panelClose.addEventListener('click', closePanel);
    scrim.addEventListener('click', closePanel);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePanel(); });

    function currentTheme(){
      return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }
    function markActive(){
      var t = currentTheme();
      themeOpts.forEach(function(b){ b.classList.toggle('active', b.dataset.themeChoice === t); });
    }
    themeOpts.forEach(function(b){
      b.addEventListener('click', function(){
        var t = b.dataset.themeChoice;
        root.setAttribute('data-theme', t);
        try{ localStorage.setItem('argayes-theme', t); }catch(e){}
        markActive();
      });
    });
    markActive();
  })();

  var qs = new URLSearchParams(location.search);
  // Estas páginas SOLO hablan con el servidor oficial de ARGAYES (o con uno
  // local cuando se está desarrollando en la propia computadora). Antes,
  // cualquier link con "?backend=..." cambiaba el servidor y lo dejaba
  // guardado: un link tramposo podía hacer que alguien escribiera su
  // contraseña en un servidor ajeno creyendo que era ARGAYES.
  var BACKEND_OFICIAL = 'https://argayes-backend.onrender.com';
  var ES_DESARROLLO = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  function backendPermitido(u){
    try {
      var x = new URL(u);
      if(x.origin === BACKEND_OFICIAL) return true;
      return ES_DESARROLLO && (x.hostname === 'localhost' || x.hostname === '127.0.0.1');
    } catch(e){ return false; }
  }
  function getBackendUrl(){
    var v = null;
    try { v = localStorage.getItem('argayes-backend-url'); } catch(e){}
    return (v && backendPermitido(v)) ? v.replace(/\/$/, '') : BACKEND_OFICIAL;
  }
  function setBackendUrl(v){
    if(!backendPermitido(v)) return;
    try { localStorage.setItem('argayes-backend-url', v.replace(/\/$/, '')); } catch(e){}
  }
  // Los campos de "Conexión al backend" son una herramienta de desarrollo:
  // un negocio o un cliente no tiene por qué verlos.
  if(!ES_DESARROLLO){
    document.querySelectorAll('.backend-settings, [data-solo-desarrollo]').forEach(function(el){ el.hidden = true; el.style.display = 'none'; });
  }
  var backendParam = (qs.get('backend') || '').trim();
  var backendUrl = (backendParam && backendPermitido(backendParam)) ? backendParam.replace(/\/$/, '') : getBackendUrl();
  if(qs.get('backend')) setBackendUrl(backendUrl);
  var clienteId = (qs.get('id') || qs.get('clienteId') || '').trim();

  async function api(path){
    var res = await fetch(backendUrl + path);
    var data = null;
    try { data = await res.json(); } catch(e){}
    if(!res.ok) throw new Error((data && data.error) || ('Error ' + res.status));
    return data;
  }

  var estadoCarga = document.getElementById('estadoCarga');
  var estadoError = document.getElementById('estadoError');
  var tarjetaWrap = document.getElementById('tarjetaWrap');

  function mostrarError(msg){
    estadoCarga.hidden = true;
    estadoError.hidden = false;
    estadoError.textContent = msg;
  }

  var TAMANOS_PX = { pequeno: 24, mediano: 32, grande: 42 };

  // Mismo catálogo que public-frontend/index.html (CATALOGO_SELLOS_EXTRA) y
  // lib/db.js (SELLO_FORMAS_VALIDAS) — si se agrega un sello nuevo allá,
  // hay que agregarlo aquí también para que esta tarjeta (la que de verdad
  // ve el cliente) lo pinte bien en vez de caer al círculo por defecto.
  var EMOJI_SELLOS = {"pizza":"🍕","hamburguesa":"🍔","hotdog":"🌭","taco":"🌮","burrito":"🌯","sushi":"🍣","bento":"🍱","ramen":"🍜","ensalada":"🥗","papas":"🍟","pollo":"🍗","carne":"🥩","sandwich":"🥪","cuernito":"🥐","bagel":"🥯","pan":"🍞","queso":"🧀","hotcakes":"🥞","waffle":"🧇","huevo":"🍳","dona":"🍩","galleta":"🍪","pastel":"🎂","cupcake":"🧁","rebanada":"🍰","chocolate":"🍫","dulce":"🍬","paleta":"🍭","helado":"🍦","copahelado":"🍨","raspado":"🍧","sandia":"🍉","fresa":"🍓","uvas":"🍇","limon":"🍋","aguacate":"🥑","cafe":"☕","te":"🍵","bubbletea":"🧋","refresco":"🥤","cerveza":"🍺","vino":"🍷","coctel":"🍸","brindis":"🥂","champan":"🍾","tijeras":"✂️","barberia":"💈","corte":"💇","unas":"💅","labial":"💄","locion":"🧴","jabon":"🧼","lavanderia":"🧺","camisa":"👕","vestido":"👗","tenis":"👟","bolsa":"👜","anillo":"💍","lentes":"🕶️","reloj":"⌚","celular":"📱","laptop":"💻","impresion":"🖨️","camara":"📷","videojuego":"🎮","libros":"📚","pluma":"🖊️","arte":"🎨","musica":"🎵","cine":"🎬","gym":"🏋️","futbol":"⚽","basquet":"🏀","yoga":"🧘","auto":"🚗","bici":"🚲","gasolina":"⛽","mascota":"🐾","perro":"🐶","gato":"🐱","planta":"🌿","flor":"🌸","ramo":"💐","regalo":"🎁","globo":"🎈","fiesta":"🎉","casa":"🏠","llave":"🔑","herramientas":"🛠️","tuercas":"🔧","foco":"💡","salud":"🏥","medicina":"💊","dental":"🦷","spa":"💆","bano":"🛀"};

  function svgSello(forma, relleno, px){
    if(EMOJI_SELLOS[forma]){
      var atenuado = relleno ? '' : 'opacity:.35;filter:grayscale(60%);';
      return '<img src="img/sellos/' + forma + '.png" alt="" draggable="false" style="width:100%;height:100%;object-fit:contain;' + atenuado + '">';
    }
    var v = 'viewBox="0 0 24 24"';
    if(!relleno){
      if(forma === 'estrella') return '<svg ' + v + ' fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.9.9-5 4.8 1.3 6.8L12 17.6 5.9 20.8l1.3-6.8-5-4.8 6.9-.9z"/></svg>';
      if(forma === 'corazon') return '<svg ' + v + ' fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20.3s-7.8-4.7-9.8-9.3C.9 7.6 2.6 4 6.2 4c2 0 3.5 1.1 4.3 2.6.3.5.5 1 .5 1 0 0 .2-.5.5-1C12.3 5.1 13.8 4 15.8 4c3.6 0 5.3 3.6 4 7-2 4.6-9.8 9.3-9.8 9.3z"/></svg>';
      if(forma === 'cuadrado') return '<svg ' + v + ' fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>';
      return '<svg ' + v + ' fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>';
    }
    if(forma === 'estrella') return '<svg ' + v + ' fill="currentColor"><path d="M12 2l2.9 6.3 6.9.9-5 4.8 1.3 6.8L12 17.6 5.9 20.8l1.3-6.8-5-4.8 6.9-.9z"/></svg>';
    if(forma === 'corazon') return '<svg ' + v + ' fill="currentColor"><path d="M12 20.3s-7.8-4.7-9.8-9.3C.9 7.6 2.6 4 6.2 4c2 0 3.5 1.1 4.3 2.6.3.5.5 1 .5 1 0 0 .2-.5.5-1C12.3 5.1 13.8 4 15.8 4c3.6 0 5.3 3.6 4 7-2 4.6-9.8 9.3-9.8 9.3z"/></svg>';
    if(forma === 'cuadrado') return '<svg ' + v + ' fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>';
    return '<svg ' + v + ' fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>';
  }

  // ¿El color es claro? (para decidir si el texto encima va oscuro o blanco)
  function esClaro(hex){
    var h = String(hex || '').replace('#', '');
    if(h.length !== 6) return false;
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.62;
  }

  function pintarTarjeta(empresa, cliente){
    var card = document.getElementById('tcCard');
    var fondo = /^#[0-9a-fA-F]{6}$/.test(empresa.color || '') ? empresa.color : '#b8872b';
    // Sobre un color de marca claro (amarillo, rosa pastel...) el texto
    // blanco no se leía: la tinta se elige según el fondo.
    var claro = esClaro(fondo);
    var tinta = claro ? '#1b1f23' : '#ffffff';
    var tintaTenue = claro ? 'rgba(27,31,35,.32)' : 'rgba(255,255,255,.4)';
    card.style.background = fondo;
    card.style.color = tinta;
    card.style.fontFamily = "'" + (empresa.fuente || 'IBM Plex Sans') + "', " + 'var(--font-body)';

    document.getElementById('tcNombre').textContent = empresa.nombre || 'ARGAYES';
    // El logo se arma como elemento (no pegando texto dentro de HTML) y solo
    // si es una imagen de verdad: ese valor lo escribe el negocio.
    var logoWrap = document.getElementById('tcLogoWrap');
    logoWrap.textContent = '';
    if(typeof empresa.logoUrl === 'string' && /^(data:image\/(png|jpeg|webp);base64,|https:\/\/)/.test(empresa.logoUrl)){
      var img = document.createElement('img');
      img.alt = '';
      img.src = empresa.logoUrl;
      logoWrap.appendChild(img);
    }
    logoWrap.style.display = logoWrap.firstChild ? '' : 'none';

    var umbral = Math.min(20, Math.max(1, Number(empresa.umbral) || 10));
    var puntos = Math.max(0, Number(cliente.puntos) || 0);
    var sellosLlenos = Math.min(puntos, umbral);
    document.getElementById('tcContador').textContent = sellosLlenos + '/' + umbral;

    var px = TAMANOS_PX[empresa.selloTamano] || TAMANOS_PX.mediano;
    var grid = document.getElementById('tcSellosGrid');
    var html = '';
    for(var i = 0; i < umbral; i++){
      var lleno = i < sellosLlenos;
      html += '<span style="width:' + px + 'px;height:' + px + 'px;display:flex;color:' + (lleno ? tinta : tintaTenue) + '">' + svgSello(empresa.selloForma || 'circulo', lleno, px) + '</span>';
    }
    grid.innerHTML = html;

    document.getElementById('tcRecompensa').textContent = empresa.recompensa || '—';
    document.getElementById('tcCliente').textContent = cliente.nombre || '—';

    var qrWrap = document.getElementById('tcQrWrap');
    qrWrap.innerHTML = '';
    new QRCode(qrWrap, {
      text: cliente.id,
      width: 84, height: 84,
      // Un QR claro sobre blanco no lo lee ninguna cámara: si el color que
      // eligió el negocio es claro, el QR se pinta oscuro.
      colorDark: '#1b1f23',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('listoBanner').hidden = puntos < umbral;
    var faltan = umbral - sellosLlenos;
    var recompensaTxt = empresa.recompensa ? (': ' + empresa.recompensa) : '';
    document.getElementById('progresoTxt').textContent = faltan <= 0
      ? '¡Juntaste todos tus sellos!'
      : (faltan === 1 ? 'Te falta 1 sello para tu recompensa' : 'Te faltan ' + faltan + ' sellos para tu recompensa') + recompensaTxt;

    estadoCarga.hidden = true;
    tarjetaWrap.hidden = false;
  }

  async function init(){
    if(!backendUrl){
      mostrarError('Este link no trae la información de tu negocio todavía. Pide que te compartan de nuevo el link desde el registro.');
      return;
    }
    if(!clienteId){
      mostrarError('Este link no trae tu código de cliente. Pide que te compartan de nuevo el link desde el registro.');
      return;
    }
    try {
      var cliente = await api('/api/clientes/' + encodeURIComponent(clienteId));
      var empresa = await api('/api/empresas/' + encodeURIComponent(cliente.empresaId));
      pintarTarjeta(empresa, cliente);
      prepararWallet();
      mantenerAlDia(empresa, cliente.puntos);
    } catch(e){
      mostrarError('No pudimos cargar tu tarjeta todavía. Intenta de nuevo en un momento o pide que te compartan el link una vez más.');
    }
  }

  // La tarjeta se actualiza sola: cuando el negocio escanea el QR, el sello
  // nuevo aparece sin que el cliente tenga que recargar la página. Solo
  // consulta mientras la pestaña está a la vista.
  function mantenerAlDia(empresa, puntosIniciales){
    var puntos = puntosIniciales;
    var ocupado = false;
    async function revisar(){
      if(ocupado || document.hidden) return;
      ocupado = true;
      try {
        var c = await api('/api/clientes/' + encodeURIComponent(clienteId));
        if(c.puntos !== puntos){ puntos = c.puntos; pintarTarjeta(empresa, c); }
      } catch(e){ /* sin conexión un momento: se reintenta en la siguiente vuelta */ }
      ocupado = false;
    }
    setInterval(revisar, 15000);
    document.addEventListener('visibilitychange', revisar);
  }

  // Botones para guardar la tarjeta en la wallet del teléfono: en iPhone se
  // ofrece Apple Wallet, en Android Google Wallet, y en computadora ambos.
  function prepararWallet(){
    var ua = navigator.userAgent || '';
    var esIOS = /iPhone|iPad|iPod/.test(ua);
    var esAndroid = /Android/.test(ua);
    var appleBtn = document.getElementById('appleBtn');
    var googleBtn = document.getElementById('googleBtn');
    var msg = document.getElementById('walletMsg');
    appleBtn.href = backendUrl + '/api/wallet/apple/' + encodeURIComponent(clienteId) + '.pkpass';
    appleBtn.hidden = esAndroid;
    googleBtn.hidden = esIOS;
    googleBtn.addEventListener('click', async function(){
      googleBtn.disabled = true;
      msg.hidden = true;
      try {
        var r = await api('/api/wallet/google/' + encodeURIComponent(clienteId));
        window.location.href = r.saveUrl;
      } catch(e){
        msg.textContent = e.message || 'Google Wallet no está disponible en este momento.';
        msg.hidden = false;
      } finally {
        googleBtn.disabled = false;
      }
    });
  }
  init();
})();
</script>
