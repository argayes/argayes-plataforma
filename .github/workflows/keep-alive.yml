name: Mantener despierto el backend (Render)

# En el plan gratis de Render el servidor se apaga tras ~15 min sin visitas, y
# la primera petición después de eso espera 30-50 segundos (la IA de voz y
# WhatsApp se quedan esperando). GitHub retrasa mucho los cron cortos (en la
# práctica corría cada 45-75 min), así que cada ejecución se queda viva casi
# 6 horas haciendo ping cada 5 minutos. Se agenda cada hora; "concurrency"
# deja solo una corriendo y otra en espera, así siempre hay una activa.
# Se puede borrar este archivo cuando el backend pase a un plan de pago.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping al backend cada 5 minutos (~5 h 50 min)
        run: |
          for i in $(seq 1 70); do
            if curl -fsS -o /dev/null --max-time 60 --retry 3 --retry-delay 10 https://argayes-backend.onrender.com/; then
              echo "$(date -u +%H:%M) backend despierto"
            else
              echo "$(date -u +%H:%M) el ping fallo (se reintenta en 5 min)"
            fi
            sleep 300
          done
